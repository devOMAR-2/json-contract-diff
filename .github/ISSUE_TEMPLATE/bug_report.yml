name: Bug report
description: Report incorrect output, a crash, or unexpected behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not report security vulnerabilities here; see the security policy instead.
        Please remove any sensitive data from the JSON you share.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: old-json
    attributes:
      label: Old JSON
      description: The minimal "old" (baseline) JSON value that reproduces the problem.
      render: json
    validations:
      required: true

  - type: textarea
    id: new-json
    attributes:
      label: New JSON
      description: The minimal "new" (candidate) JSON value that reproduces the problem.
      render: json
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact CLI command (including flags) or API call you ran.
      placeholder: |
        npx json-contract-diff old.json new.json --fail-on breaking
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen (output, exit code, detected changes).
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include the full output and exit code.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: json-contract-diff version
      description: Output of `npx json-contract-diff --version`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v22.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help, such as a link to a repository that reproduces the issue.
    validations:
      required: false
